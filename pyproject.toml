[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dropscope"
version = "0.1.0"
description = "Real-time drop attribution for AI/RoCEv2 fabrics in SONiC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "tabulate>=0.9",
]

[project.scripts]
dropscope = "dropscope.cli:cli"

[project.optional-dependencies]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
